<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCP6 — Job Detail</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <section class="screen" id="screen-detail">
        <div class="page-head">
          <div>
            <h1 class="page-title" id="detail-title">CCP6 Job</h1>
            <p class="page-sub" id="detail-flight-sub"></p>
          </div>
          <div class="page-actions">
            <button
              type="button"
              class="btn-icon"
              onclick="toggleWebReportPopover(event)"
              aria-label="Web Report options"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="5" r="1" />
                <circle cx="12" cy="12" r="1" />
                <circle cx="12" cy="19" r="1" />
              </svg>
            </button>
            <div id="web-report-popover" class="web-report-popover hidden">
              <ul class="web-report-menu" role="menu">
                <li role="menuitem" onclick="goToWebReport()">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                  </svg>
                  <span class="wr-menu-label">Web Report</span>
                </li>
              </ul>
            </div>
            <button
              type="button"
              class="btn-back"
              onclick="navigate('current')"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
              Back
            </button>
          </div>
        </div>

        <!-- Persistent shared header -->
        <div class="job-header" id="detail-header"></div>

        <!-- Stage tabs -->
        <div class="tab-bar" id="detail-tabs"></div>

        <div class="tab-body" id="detail-body"></div>
      </section>
    </div>

    <!-- Sign-off modal -->
    <div id="signoff-overlay" class="modal-overlay hidden">
      <div class="modal">
        <h2 class="modal-title">Sign Off — <span id="signoff-stage"></span></h2>
        <p class="modal-sub">Confirm your identity to submit this stage</p>

        <div id="signoff-error" class="badge-error hidden"></div>

        <div class="modal-tabs" id="signoff-methods"></div>

        <div class="form-group">
          <label class="form-label" id="signoff-input-label" for="signoff-input"
            >Staff ID</label
          >
          <input
            type="text"
            id="signoff-input"
            class="form-input"
            autocomplete="off"
          />
        </div>

        <button
          type="button"
          class="btn-primary modal-verify"
          onclick="resolveIdentity()"
        >
          Verify &amp; Confirm
        </button>

        <div class="modal-identity hidden" id="signoff-confirm">
          <p class="identity-name" id="signoff-name"></p>
          <p class="identity-meta" id="signoff-role"></p>
          <div class="modal-actions">
            <button
              type="button"
              class="btn-secondary"
              onclick="confirmSignoff(true)"
            >
              Confirm Submit
            </button>
            <button
              type="button"
              class="btn-secondary"
              onclick="confirmSignoff(false)"
            >
              Change
            </button>
          </div>
        </div>

        <button
          type="button"
          class="btn-ghost"
          id="signoff-cancel"
          onclick="closeSignoff()"
        >
          Cancel
        </button>
      </div>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
