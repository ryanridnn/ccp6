<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCP6 — Web Report</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <section class="screen" id="screen-report">
        <div class="page-head">
          <div>
            <h1 class="page-title">CCP6 Web Report</h1>
            <p class="page-sub" id="report-sub"></p>
          </div>
          <div class="page-actions">
            <button
              type="button"
              class="btn-secondary"
              onclick="exportJob('pdf')"
            >
              PDF
            </button>
            <button
              type="button"
              class="btn-secondary"
              onclick="exportJob('excel')"
            >
              Excel
            </button>
            <button
              type="button"
              class="btn-back"
              onclick="navigate('current')"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
              Back
            </button>
          </div>
        </div>

        <div class="report-body" id="report-body"></div>
      </section>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
