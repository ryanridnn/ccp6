<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCP6 — Web Report</title>
    
  <style>/* style.css */
:root {
  --bg-page: #f5f7fa;
  --bg-surface: #fff;
  --bg-surface-hover: #f8fafc;
  --border: #e2e8f0;
  --border-hover: #cbd5e1;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --accent-contrast: #fff;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --info: #0ea5e9;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg-page);
  color: var(--text-secondary);
  overflow-x: hidden;
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
  line-height: 1.6;
}

.app {
  max-width: 1440px;
  margin: 0 auto;
}

.hidden {
  display: none !important;
}

.screen {
  display: block;
  padding: 24px 24px 72px;
}

#screen-current {
  display: block;
}

#screen-current .screen-body {
  padding: 24px 24px 72px;
}

.page-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items:  center;
  gap: 16px;
  margin-bottom: 20px;
}

.page-title {
  color: var(--text-primary);
  font-size: 24px;
  font-weight: 700;
}

.page-sub {
  color: var(--text-secondary);
  margin-top: 2px;
  font-size: 14px;
}

.page-actions {
  display: flex;
  flex-wrap: wrap;
  align-items:  center;
  gap: 8px;
}

.btn-primary, .btn-secondary, .btn-back, .btn-ghost {
  display: inline-flex;
  cursor: pointer;
  white-space: nowrap;
  border: 1px solid #0000;
  border-radius: 8px;
  align-items:  center;
  gap: 8px;
  padding: 9px 16px;
  transition: background .15s, border-color .15s, color .15s;
  font-size: 14px;
  font-weight: 600;
}

.btn-primary {
  background: var(--accent);
  color: var(--accent-contrast);
}

.btn-primary:hover {
  background: var(--accent-hover);
}

.btn-secondary {
  background: var(--bg-surface);
  border-color: var(--border);
  color: var(--text-primary);
}

.btn-secondary:hover {
  background: var(--bg-surface-hover);
  border-color: var(--border-hover);
}

.btn-back {
  border-color: var(--border);
  color: var(--text-secondary);
  backdrop-filter: blur(8px);
  background: linear-gradient(135deg, #6366f10a 0%, #818cf805 100%);
  box-shadow: 0 2px 8px #0000000f;
}

.btn-back svg {
  transition: transform .2s;
}

.btn-back:hover {
  border-color: var(--accent);
  color: var(--text-primary);
  background: linear-gradient(135deg, #6366f114 0%, #818cf80a 100%);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px #6366f11a;
}

.btn-back:hover svg {
  transform: translateX(-3px);
}

.btn-back:active {
  transform: translateY(0);
  box-shadow: 0 2px 6px #6366f114;
}

.btn-ghost {
  color: var(--text-secondary);
  background: none;
  border-color: #0000;
}

.btn-ghost:hover {
  color: var(--text-primary);
}

.btn-primary:disabled, .btn-secondary:disabled, .btn-back:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items:  center;
  gap: 12px;
  margin-bottom: 20px;
}

.filter-fields {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  width: 100%;
}

.filter-panel {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  border-radius: 10px;
  gap: 14px;
  margin-bottom: 20px;
  padding: 16px;
}

.sicc-selector {
  display: inline-flex;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  gap: 4px;
  padding: 4px;
}

.sicc-btn {
  color: var(--text-secondary);
  cursor: pointer;
  position: relative;
  background: none;
  border: none;
  border-radius: 6px;
  padding: 8px 20px;
  transition: all .2s;
  font-size: 14px;
  font-weight: 600;
}

.sicc-btn:first-child, .sicc-btn:last-child {
  border-radius: 6px;
}

.sicc-btn:hover {
  background: var(--bg-surface-hover);
  color: var(--text-primary);
}

.sicc-btn.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px #6366f140;
}

.sicc-topbar {
  border-bottom: 1px solid var(--border);
  display: flex;
  box-sizing: border-box;
  background: #fff;
  justify-content: flex-start;
  align-items:  center;
  width: 100vw;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
  padding: 12px 0;
}

.sicc-topbar-inner {
  display: flex;
  justify-content: space-between;
  align-items:  center;
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 24px;
}

.topbar-nav {
  display: inline-flex;
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  gap: 4px;
  padding: 4px;
}

.nav-btn {
  display: inline-flex;
  color: #64748b;
  cursor: pointer;
  background: none;
  border: none;
  border-radius: 6px;
  align-items:  center;
  gap: 8px;
  padding: 8px 16px;
  transition: all .2s;
  font-size: 14px;
  font-weight: 600;
}

.nav-btn:hover {
  color: #1e293b;
  background: #e2e8f0;
}

.nav-btn.active {
  background: var(--accent);
  color: var(--accent-contrast);
  box-shadow: 0 2px 8px #6366f140;
}

.sicc-topbar .sicc-selector {
  display: inline-flex;
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  gap: 4px;
  padding: 4px;
}

.sicc-topbar .sicc-btn {
  color: #64748b;
  cursor: pointer;
  background: none;
  border: none;
  border-radius: 6px;
  padding: 8px 20px;
  transition: all .2s;
  font-size: 14px;
  font-weight: 600;
}

.sicc-topbar .sicc-btn:hover {
  color: #1e293b;
  background: #e2e8f0;
}

.sicc-topbar .sicc-btn.active {
  color: #fff;
  background: #6366f1;
  box-shadow: 0 2px 8px #6366f140;
}

.preset-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.preset-tab {
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: 8px;
  padding: 8px 16px;
  transition: all .15s;
  font-size: 14px;
}

.preset-tab:hover {
  background: var(--bg-surface-hover);
  border-color: var(--border-hover);
}

.preset-tab.active {
  background: var(--accent);
  color: var(--accent-contrast);
  border-color: var(--accent);
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

@media (width <= 1200px) {
  .card-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (width <= 900px) {
  .card-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (width <= 600px) {
  .card-grid {
    grid-template-columns: 1fr;
  }
}

.job-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  display: flex;
  border-radius: 12px;
  flex-direction: column;
  gap: 14px;
  padding: 16px;
  transition: all .2s;
  box-shadow: 0 1px 3px #0000000a;
}

.job-card:hover {
  border-color: var(--border-hover);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px #00000014;
}

.job-card-head {
  display: flex;
  justify-content: space-between;
  align-items:  flex-start;
  gap: 10px;
}

.job-card-flight {
  color: var(--text-primary);
  font-size: 16px;
  font-weight: 700;
}

.job-card-meta {
  color: var(--text-secondary);
  margin-top: 2px;
  font-size: 13px;
}

.card-rows {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.card-row {
  display: flex;
  border-bottom: 1px solid #e2e8f080;
  justify-content: space-between;
  align-items:  center;
  gap: 10px;
  padding: 4px 0;
  font-size: 13px;
}

.card-row:last-child {
  border-bottom: none;
}

.card-row-label {
  color: var(--text-secondary);
}

.card-action {
  justify-content: center;
  width: 100%;
  margin-top: 4px;
  transition: all .2s;
}

.card-action:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px #6366f133;
}

.form-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 12px;
}

.form-section {
  border-top: 1px solid var(--border);
  padding: 20px 24px;
}

.form-section:first-child {
  border-top: none;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.info-banner {
  display: flex;
  color: var(--text-primary);
  background: #6366f10a;
  border: 1px solid #6366f11f;
  border-radius: 8px;
  gap: 10px;
  margin-bottom: 16px;
  padding: 14px 18px;
  font-size: 14px;
  line-height: 1.5;
}

.info-banner svg {
  color: var(--accent);
  flex-shrink: 0;
  width: 18px;
  height: 18px;
}

.info-banner strong {
  color: var(--accent-hover);
}

.section-badge {
  background: var(--bg-page);
  border: 1px solid var(--border);
  color: var(--text-primary);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
}

.section-subtitle {
  color: var(--text-secondary);
  font-size: 13px;
}

.preset-wrapper {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  overflow: hidden;
  border-radius: 12px;
  margin-bottom: 16px;
}

.preset-wrapper-content {
  padding: 16px;
}

.service-panel {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  overflow: hidden;
  border-radius: 10px;
  margin-bottom: 16px;
}

.service-panel:last-child {
  margin-bottom: 0;
}

.service-panel-header {
  display: flex;
  border-bottom: 1px solid var(--border);
  justify-content: space-between;
  align-items:  center;
  padding: 16px 20px;
}

.service-panel-title {
  color: var(--text-primary);
  font-size: 16px;
  font-weight: 700;
}

.remove-service-btn {
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  background: none;
  border: none;
  border-radius: 4px;
  justify-content: center;
  align-items:  center;
  padding: 4px;
  transition: all .15s;
}

.remove-service-btn:hover {
  color: var(--danger);
  background: #ef44441a;
}

.service-panel-timer {
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
  font-size: 18px;
  font-weight: 700;
}

.service-panel-timer span {
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 400;
}

.service-panel-body {
  padding: 20px;
}

.service-panel-footer {
  display: flex;
  border-top: 1px dashed var(--border);
  justify-content: space-between;
  align-items:  center;
  padding: 16px 20px;
}

.service-panel-footer-text {
  color: var(--text-secondary);
  font-size: 13px;
}

.metric-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 20px;
}

.metric-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
}

.metric-card.compliant {
  background: #22c55e14;
  border-color: #22c55e4d;
}

.metric-label {
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-secondary);
  margin-bottom: 8px;
  font-size: 11px;
  font-weight: 700;
}

.metric-value {
  color: var(--text-primary);
  margin-bottom: 4px;
  font-size: 24px;
  font-weight: 700;
}

.metric-status {
  color: #4ade80;
  display: flex;
  align-items:  center;
  gap: 4px;
  font-size: 12px;
}

.add-service-btn {
  border: 1px dashed var(--border);
  color: var(--accent);
  cursor: pointer;
  background: none;
  border-radius: 8px;
  width: 100%;
  margin-bottom: 16px;
  padding: 12px 20px;
  transition: all .15s;
  font-size: 14px;
  font-weight: 600;
}

.add-service-btn:hover {
  border-color: var(--accent);
  background: #6366f10a;
}

.metric-status svg {
  width: 14px;
  height: 14px;
}

.metric-hint {
  color: var(--text-secondary);
  font-size: 12px;
}

.preset-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1.2fr;
  gap: 16px;
  margin-bottom: 16px;
}

.timer-cell {
  background: var(--bg-surface-hover);
  border: 1px solid var(--border);
  display: flex;
  border-radius: 10px;
  flex-direction: row;
  justify-content: space-between;
  align-items:  center;
  height: 100%;
  padding: 12px 16px;
}

.timer-cell .timer-info {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.timer-cell .timer-label {
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
}

.timer-cell .timer-display {
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
  letter-spacing: -.02em;
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
}

.timer-cell .timer-display span {
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 400;
}

.timer-cell .timer-controls {
  display: flex;
  gap: 8px;
}

.timer-cell .timer-btn {
  display: inline-flex;
  color: #fff;
  cursor: pointer;
  background: linear-gradient(135deg, #6366f1 0%, #7c3aed 100%);
  border: none;
  border-radius: 8px;
  align-items:  center;
  gap: 6px;
  padding: 8px 16px;
  transition: all .2s;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 2px 8px #6366f126;
}

.timer-cell .timer-btn:hover {
  background: linear-gradient(135deg, #6366f1 0%, #7c3aed 100%);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px #6366f133;
}

.timer-cell .timer-btn:active {
  transform: translateY(0);
}

.timer-cell .timer-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
  box-shadow: none;
}

.timer-cell .timer-btn svg {
  width: 16px;
  height: 16px;
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  color: var(--text-primary);
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 600;
}

.form-label.required:after {
  content: " *";
  color: var(--danger);
}

.form-input, select.form-input {
  border: 1px solid var(--border);
  background: var(--bg-page);
  color: var(--text-primary);
  outline: none;
  border-radius: 8px;
  width: 100%;
  padding: 9px 12px;
  transition: border-color .15s;
  font-size: 14px;
}

.form-input::placeholder {
  color: var(--text-secondary);
}

.form-input:focus {
  border-color: var(--accent);
}

.form-input:disabled {
  opacity: .6;
}

.form-input[readonly] {
  background: var(--bg-page);
  color: var(--text-primary);
  cursor: default;
  opacity: 1;
}

.field-hint {
  color: var(--text-secondary);
  margin-top: 4px;
  font-size: 12px;
}

.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 8px;
}

.searchable-dropdown {
  position: relative;
}

.dropdown-arrow {
  position: absolute;
  color: var(--text-secondary);
  pointer-events: none;
  top: 50%;
  right: 12px;
  transform: translateY(-50%);
}

.dropdown-clear {
  position: absolute;
  color: var(--text-secondary);
  cursor: pointer;
  z-index: 5;
  background: none;
  border: none;
  border-radius: 4px;
  padding: 4px 8px;
  transition: all .15s;
  font-size: 18px;
  line-height: 1;
  top: 50%;
  right: 32px;
  transform: translateY(-50%);
}

.dropdown-clear:hover {
  background: var(--bg-surface-hover);
  color: var(--text-primary);
}

.dropdown-list {
  position: absolute;
  background: var(--bg-surface-hover);
  border: 1px solid var(--border);
  overflow: auto;
  z-index: 20;
  border-radius: 8px;
  max-height: 240px;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
}

.dropdown-item {
  color: var(--text-primary);
  cursor: pointer;
  padding: 9px 12px;
  font-size: 14px;
}

.dropdown-item:hover {
  background: var(--bg-page);
}

.dropdown-empty {
  color: var(--text-secondary);
  padding: 12px;
  font-size: 13px;
}

.rule-preview, .linked-preview {
  margin-bottom: 16px;
}

.rule-preview-inner, .linked-preview-inner {
  background: var(--bg-page);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
}

.rule-item {
  display: inline-flex;
  color: var(--text-secondary);
  margin-right: 18px;
}

.rule-item b {
  color: var(--text-primary);
}

.job-header {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  display: flex;
  border-radius: 12px;
  flex-wrap: wrap;
  gap: 14px 20px;
  margin-bottom: 16px;
  padding: 16px 20px;
}

.job-header-field {
  flex: 170px;
  min-width: 150px;
}

.job-header-field .form-label {
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--text-secondary);
  margin-bottom: 5px;
  font-size: 11px;
}

.job-header-field .form-input {
  background: var(--bg-page);
  width: 100%;
}

.job-header-field .form-input.accent {
  color: var(--accent-hover);
}

.job-header-field .form-input:disabled {
  opacity: .85;
  cursor: not-allowed;
}

.tab-bar {
  display: flex;
  background: var(--bg-surface);
  border: none;
  border-radius: 10px;
  gap: 16px;
  margin-bottom: 16px;
  padding: 8px;
}

.tab-card {
  cursor: pointer;
  background: none;
  border: 1px solid #0000;
  border-radius: 6px;
  flex: 1;
  padding: 10px 14px;
  transition: all .15s;
}

.tab-card:hover {
  background: #6366f10a;
}

.tab-card.active {
  background: var(--bg-surface-hover);
  border-color: var(--accent);
}

.tab-header {
  display: flex;
  justify-content: space-between;
  align-items:  center;
  margin-bottom: 2px;
}

.tab-title {
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
}

.tab-subtitle {
  color: var(--text-secondary);
  font-size: 12px;
}

.tab-body {
  min-height: 200px;
}

.panel {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 16px;
  padding: 16px 20px;
}

.panel-title {
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--text-secondary);
  margin-bottom: 12px;
  font-size: 13px;
  font-weight: 700;
}

.dispatch-panels {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.dispatch-panel {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
}

.dispatch-panel .panel-title {
  color: var(--text-primary);
  margin-bottom: 16px;
  font-size: 16px;
  font-weight: 700;
}

.timer-display {
  display: flex;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
  align-items:  center;
  gap: 8px;
  font-size: 22px;
  font-weight: 700;
}

.status-pill {
  display: inline-flex;
  border: 1px solid #0000;
  border-radius: 9999px;
  align-items:  center;
  gap: 6px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.5;
}

.status-pill.not-started {
  color: #64748b;
  background: #f1f5f9;
  border-color: #e2e8f0;
}

.status-pill.in-progress {
  color: var(--info);
  background: #38bdf81f;

    if (p.status === "Submitted")
      return p.complianceResult === "Compliant" ? "Compliant" : "Non-Compliant";
    if (p.startTime && !p.finishTime)
      return "In Progress";
    return "Not Started";
  }
  if (stage === "foodchecker") {
    const fc = job.foodChecker;
    const items = fc.items || [];
    if (fc.status === "Submitted") {
      const nc = items.filter((i) => i.complianceResult === "Non-Compliant").length;
      return nc ? "Non-Compliant" : "Compliant";
    }

    noBtn.classList.add("active");
    yesBtn.classList.remove("active");
  }
}
window.toggleDisposed = toggleDisposed;
window.preview = preview;
window.exportJob = exportJob;
window.renderReport = renderReport;
window.navigate = (s) => {
  if (s === "current")
    preview.go(VIEWS.current);
};
document.addEventListener("DOMContentLoaded", async () => {
  if (!state.jobs.length)
    state.jobs = buildSeed();
  const recordId = preview.recordId();
  if (recordId)
    state.activeJobId = recordId;
  await loadJobs();
  if (recordId) {
    const m = findJobByRecord(recordId);
    if (m)
      state.activeJobId = m.job_id;
    else
      state.activeJobId = recordId;
  }
  renderReport();
});
</script></body>
</html>
