<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCP6 Operational Service</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- Loading overlay -->
      <div id="loader-overlay" class="loader-overlay">
        <div class="loader-content">
          <div class="loader-spinner"></div>
          <span>Loading CCP6...</span>
        </div>
      </div>
      <!-- ============================= S1 · Current CCP6 Jobs ============================= -->
      <section id="screen-current">
        <div class="sicc-topbar">
          <div class="sicc-topbar-inner">
            <div class="topbar-nav">
              <button
                type="button"
                class="nav-btn active"
                data-screen="current"
                onclick="navigate('current')"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="3" width="7" height="7" />
                  <rect x="14" y="3" width="7" height="7" />
                  <rect x="14" y="14" width="7" height="7" />
                  <rect x="3" y="14" width="7" height="7" />
                </svg>
                Current CCP6 Jobs
              </button>
              <button
                type="button"
                class="nav-btn"
                data-screen="all"
                onclick="navigate('all')"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="8" y1="6" x2="21" y2="6" />
                  <line x1="8" y1="12" x2="21" y2="12" />
                  <line x1="8" y1="18" x2="21" y2="18" />
                  <line x1="3" y1="6" x2="3.01" y2="6" />
                  <line x1="3" y1="12" x2="3.01" y2="12" />
                  <line x1="3" y1="18" x2="3.01" y2="18" />
                </svg>
                All CCP6 Jobs
              </button>

            </div>
            <div class="sicc-selector" id="sicc-selector">
              <button
                type="button"
                class="sicc-btn active"
                data-sicc="SICC1"
                onclick="filterBySICC('SICC1')"
              >
                SICC1
              </button>
              <button
                type="button"
                class="sicc-btn"
                data-sicc="SICC2"
                onclick="filterBySICC('SICC2')"
              >
                SICC2
              </button>
            </div>
          </div>
        </div>

        <div class="screen-body">
          <div class="page-head">
            <div>
              <h1 class="page-title">Current CCP6 Jobs</h1>
              <p class="page-sub">Jobs needing operational attention</p>
            </div>
            <button
              type="button"
              class="btn-primary"
              onclick="navigate('create')"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                />
                <polyline points="14 2 14 8 20 8" />
                <line x1="12" y1="18" x2="12" y2="12" />
                <line x1="9" y1="15" x2="15" y2="15" />
              </svg>
              Create CCP6 Job
            </button>
          </div>

          <div class="toolbar">
            <div class="filter-fields" id="current-filters"></div>
          </div>

          <div class="card-grid" id="current-grid"></div>
        </div>
      </section>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
