<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCP6 Operational Service</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- ============================= S1 · Current CCP6 Jobs ============================= -->
      <section id="screen-current">
        <div class="sicc-topbar">
          <div class="sicc-topbar-inner">
            <div class="topbar-nav">
              <button type="button" class="nav-btn active" data-screen="current" onclick="navigate('current')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="7" />
                  <rect x="14" y="3" width="7" height="7" />
                  <rect x="14" y="14" width="7" height="7" />
                  <rect x="3" y="14" width="7" height="7" />
                </svg>
                Current CCP6 Jobs
              </button>
              <button type="button" class="nav-btn" data-screen="all" onclick="navigate('all')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="8" y1="6" x2="21" y2="6" />
                  <line x1="8" y1="12" x2="21" y2="12" />
                  <line x1="8" y1="18" x2="21" y2="18" />
                  <line x1="3" y1="6" x2="3.01" y2="6" />
                  <line x1="3" y1="12" x2="3.01" y2="12" />
                  <line x1="3" y1="18" x2="3.01" y2="18" />
                </svg>
                All CCP6 Jobs
              </button>
            </div>
            <div class="sicc-selector">
              <button type="button" class="sicc-btn active" data-sicc="SICC1" onclick="filterBySICC('SICC1')">SICC1</button>
              <button type="button" class="sicc-btn" data-sicc="SICC2" onclick="filterBySICC('SICC2')">SICC2</button>
            </div>
          </div>
        </div>

        <div class="screen-body">
          <div class="page-head">
          <div>
            <h1 class="page-title">Current CCP6 Jobs</h1>
            <p class="page-sub">Jobs needing operational attention</p>
          </div>
          <button type="button" class="btn-primary" onclick="navigate('create')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="12" y1="18" x2="12" y2="12" />
              <line x1="9" y1="15" x2="15" y2="15" />
            </svg>
            Create CCP6 Job
          </button>
        </div>

        <div class="toolbar">
          <div class="filter-fields" id="current-filters"></div>
        </div>

        <div class="card-grid" id="current-grid"></div>
        </div>
      </section>

      <!-- ============================= S3 · Create CCP6 Job ============================= -->
      <section class="screen hidden" id="screen-create">
        <div class="page-head">
          <div>
            <h1 class="page-title">Create CCP6 Job — SICC1</h1>
          </div>
          <button type="button" class="btn-back" onclick="navigate('current')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back
          </button>
        </div>

        <div class="form-card">
          <form id="create-form" onsubmit="submitCreateJob(event)">
            <div class="form-section">
              <div class="create-header-row">
                <div class="form-group create-flight-group">
                  <label class="form-label required" for="create-flight">Flight Number</label>
                  <div class="searchable-dropdown" id="create-flight-wrap">
                    <input type="text" id="create-flight" class="form-input" placeholder="Search flight…" autocomplete="off" required />
                    <button type="button" class="dropdown-clear hidden" id="create-flight-clear" onclick="clearCreateFlight()">×</button>
                    <div class="dropdown-arrow">▾</div>
                    <div class="dropdown-list hidden" id="create-flight-list"></div>
                  </div>
                </div>

                <div class="form-group create-etd-group">
                  <label class="form-label required" for="create-etd">ETD (24h)</label>
                  <input type="time" id="create-etd" class="form-input" required />
                </div>

                <div class="form-group create-group-group">
                  <label class="form-label required">Group</label>
                  <div class="segmented-buttons" id="create-group-buttons">
                    <button type="button" class="segment-btn" data-value="A">A</button>
                    <button type="button" class="segment-btn" data-value="B">B</button>
                    <button type="button" class="segment-btn" data-value="C">C</button>
                    <button type="button" class="segment-btn" data-value="D">D</button>
                  </div>
                  <input type="hidden" id="create-group" required />
                </div>
              </div>

              <div id="create-items-container" class="hidden">
                <div class="create-items-header">
                  <h3 class="create-items-title">Linked Items</h3>
                  <span class="create-items-count" id="create-items-count">0 items selected</span>
                </div>
                <div class="create-items-list" id="create-items-list"></div>
              </div>

              <div id="ad-hoc-toggle" class="ad-hoc-toggle hidden" style="margin-top: 16px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                  <input type="checkbox" id="ad-hoc-checkbox" onchange="toggleAdHocMode()" />
                  <span>Add Ad Hoc items manually</span>
                </label>
              </div>

              <div id="ad-hoc-container" class="hidden" style="margin-top: 16px;">
                <div class="create-items-header">
                  <h3 class="create-items-title">Ad Hoc Items</h3>
                  <button type="button" class="btn-secondary" onclick="addAdHocItem()" style="padding: 6px 12px; font-size: 12px;">+ Add Item</button>
                </div>
                <div id="ad-hoc-list"></div>
              </div>

              <div class="form-actions" style="margin-top: 24px;">
                <button type="button" class="btn-secondary" onclick="navigate('current')">Cancel</button>
                <button type="submit" class="btn-primary">Create job</button>
              </div>
            </div>
          </form>
        </div>
      </section>

      <!-- ============================= S4 · Job Detail ============================= -->
      <section class="screen hidden" id="screen-detail">
        <div class="page-head">
          <div>
            <h1 class="page-title" id="detail-title">CCP6 Job</h1>
            <p class="page-sub" id="detail-flight-sub"></p>
          </div>
          <button type="button" class="btn-back" onclick="navigate('current')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back
          </button>
        </div>

        <!-- Persistent shared header -->
        <div class="job-header" id="detail-header"></div>

        <!-- Stage tabs -->
        <div class="tab-bar" id="detail-tabs"></div>

        <div class="tab-body" id="detail-body"></div>
      </section>

      <!-- ============================= S5 · Web Report ============================= -->
      <section class="screen hidden" id="screen-report">
        <div class="page-head">
          <div>
            <h1 class="page-title">CCP6 Web Report</h1>
            <p class="page-sub" id="report-sub"></p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn-secondary" onclick="exportJob('pdf')">PDF</button>
            <button type="button" class="btn-secondary" onclick="exportJob('excel')">Excel</button>
            <button type="button" class="btn-back" onclick="navigate('current')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
              Back
            </button>
          </div>
        </div>

        <div class="report-body" id="report-body"></div>
      </section>
    </div>

    <!-- Sign-off modal -->
    <div id="signoff-overlay" class="modal-overlay hidden">
      <div class="modal">
        <h2 class="modal-title">Sign Off — <span id="signoff-stage"></span></h2>
        <p class="modal-sub">Confirm your identity to submit this stage</p>

        <div id="signoff-error" class="badge-error hidden"></div>

        <div class="modal-tabs" id="signoff-methods"></div>

        <div class="form-group">
          <label class="form-label" id="signoff-input-label" for="signoff-input">Staff ID</label>
          <input type="text" id="signoff-input" class="form-input" autocomplete="off" />
        </div>

        <button type="button" class="btn-primary modal-verify" onclick="resolveIdentity()">
          Verify &amp; Confirm
        </button>

        <div class="modal-identity hidden" id="signoff-confirm">
          <p class="identity-name" id="signoff-name"></p>
          <p class="identity-meta" id="signoff-role"></p>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" onclick="confirmSignoff(true)">Confirm Submit</button>
            <button type="button" class="btn-secondary" onclick="confirmSignoff(false)">Change</button>
          </div>
        </div>

        <button type="button" class="btn-ghost" id="signoff-cancel" onclick="closeSignoff()">Cancel</button>
      </div>
    </div>
  </body>
  <script type="module" src="./script.js"></script>
</html>
